# Docker MySQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://match-db:3306/match_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:match_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:match_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JSON Configuration - Snake Case
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT-3

# Character Service Configuration
character.service.url=${CHARACTER_SERVICE_URL:http://characters-be:80}

# Server Configuration
server.port=${SERVER_PORT:8080}

# Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Wait for database to be ready
spring.datasource.hikari.initialization-fail-timeout=60000

# Initialize database with data - DISABLED
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never