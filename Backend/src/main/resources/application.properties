# ============================================
# Application
# ============================================
spring.application.name=previsar
server.port=8080

# Profile activo por defecto: dev
spring.profiles.active=dev

# ============================================
# JPA / Hibernate
# ============================================
# Hibernate NO crea ni modifica tablas. Eso lo hace Flyway.
spring.jpa.hibernate.ddl-auto=validate

# Dialecto Postgres
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Naming strategy: nombres de columna en snake_case
# (campo Java "fechaNacimiento" ? columna "fecha_nacimiento")
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# ============================================
# Flyway
# ============================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ============================================
# OpenAPI / Swagger
# ============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# ============================================
# Servlet / multipart (subida de archivos)
# ============================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
