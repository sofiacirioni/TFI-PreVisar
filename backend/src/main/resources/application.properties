# ============================================
# Application
# ============================================
spring.application.name=previsar
server.port=8080

# Profile activo por defecto: dev
spring.profiles.active=dev

# ============================================
# JPA / Hibernate
# ============================================
# Hibernate NO crea ni modifica tablas. Eso lo hace Flyway.
spring.jpa.hibernate.ddl-auto=validate

# Dialecto Postgres
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Naming strategy: nombres de columna en snake_case
# (campo Java "fechaNacimiento" -> columna "fecha_nacimiento")
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# ============================================
# Flyway
# ============================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ============================================
# OpenAPI / Swagger
# ============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# ============================================
# Servlet / multipart (subida de archivos)
# ============================================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ============================================
# Almacenamiento de documentos cargados
# ============================================
# Carpeta base donde se guardan los archivos (path en BD es relativo a esta).
previsar.storage.base-path=${PREVISAR_STORAGE_PATH:./data/expedientes}

# ============================================
# Logging para arranque limpio
# ============================================
logging.level.org.springframework.security=INFO

# CORS - origenes permitidos (separados por coma)
previsar.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ============================================
# Gemini — validacion visual (nivel 3)
# ============================================
# GOOGLE_API_KEY se toma como variable de entorno (.env), NO aca (ADR-013).
# Modelo swappable cuando cambie la familia.
previsar.gemini.model=${PREVISAR_GEMINI_MODEL:gemini-3.5-flash}
previsar.gemini.timeout-segundos=${PREVISAR_GEMINI_TIMEOUT:60}
# Timeout más largo para el análisis del expediente completo (PDF entero, visión nativa).
previsar.gemini.timeout-pdf-segundos=${PREVISAR_GEMINI_TIMEOUT_PDF:120}
previsar.gemini.dpi=${PREVISAR_GEMINI_DPI:110}
# Reintentos ante errores transitorios de Gemini (503 sobrecarga, 429 cuota, timeout), con backoff exponencial.
previsar.gemini.reintentos=${PREVISAR_GEMINI_REINTENTOS:3}

# ============================================
# Mercado Pago — arancel CIEC (checkout pro)
# ============================================
# MP_ACCESS_TOKEN se inyecta como variable de entorno (.env). Sin ella la app NO arranca.
#
# OJO: son DOS URLs distintas y NO se pueden compartir.
#  - back-url-base:    a donde MP redirige el NAVEGADOR tras pagar -> FRONTEND (:4200).
#  - webhook-url-base: a donde MP hace la llamada server-to-server -> BACKEND (:8080),
#                      y tiene que ser PUBLICA. En local: tunel ngrok apuntando al 8080
#                      (ej. https://xxxx.ngrok-free.app). Si queda vacia, la preferencia
#                      se crea sin notification_url y el pago NUNCA se confirma.
previsar.mercadopago.access-token=${MP_ACCESS_TOKEN}
previsar.mercadopago.back-url-base=${MP_BACK_URL_BASE:http://localhost:4200}
previsar.mercadopago.webhook-url-base=${MP_WEBHOOK_URL_BASE:}
# Clave secreta del webhook (panel MP -> Tus integraciones -> Webhooks -> Configurar).
# Si esta vacia NO se valida la firma: se procesa igual pero se loguea un WARN.
previsar.mercadopago.webhook-secret=${MP_WEBHOOK_SECRET:}
