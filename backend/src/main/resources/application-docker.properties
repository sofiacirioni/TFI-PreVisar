# ============================================
# Perfil "docker" — la app corriendo dentro de docker compose
# ============================================
# Se activa con SPRING_PROFILES_ACTIVE=docker (lo setea el compose).
#
# Existe porque el perfil "dev" apunta a localhost:5432, y dentro de un
# contenedor localhost es el propio contenedor, no el host: la base se alcanza
# por el nombre del servicio del compose (postgres).
#
# Todo lo que cambia entre entornos llega por variable de entorno, con defaults
# que coinciden con los del docker-compose.yml.

# ============================================
# Base de datos PostgreSQL (servicio "postgres" del compose)
# ============================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/previsar}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:previsar}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:previsar_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# JPA
# ============================================
# Sin show-sql: en un contenedor el log de cada consulta es ruido que tapa lo
# que importa. Se sube el nivel con las variables de abajo si hace falta.
spring.jpa.show-sql=false

# ============================================
# Logging
# ============================================
logging.level.ar.edu.utn.frc.previsar=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.security=INFO

# ============================================
# JWT
# ============================================
# JWT_SECRET no tiene default: sin esa variable la app NO arranca (intencional).
previsar.jwt.secret=${JWT_SECRET}
previsar.jwt.expiration-ms=${JWT_EXPIRATION_MS:10800000}
previsar.jwt.issuer=${JWT_ISSUER:previsar-api}
