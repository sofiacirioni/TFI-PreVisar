# ============================================
# Base de datos PostgreSQL (entorno local Docker)
# ============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/previsar
spring.datasource.username=previsar
spring.datasource.password=previsar_dev
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# JPA en dev: mostrar SQL en consola
# ============================================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# Logging detallado
# ============================================
logging.level.ar.edu.utn.frc.previsar=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ============================================
# JWT
# ============================================
# La clave secreta se inyecta como variable de
# entorno JWT_SECRET. Sin esa variable, la app NO arranca (intencional).
previsar.jwt.secret=${JWT_SECRET}

# Duracion del token en milisegundos: 1 hora = 3600000
previsar.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Issuer (quien emite el token, identifica esta app)
previsar.jwt.issuer=${JWT_ISSUER:previsar-api}