# =============================================================================
# Nginx — sirve la SPA compilada y hace de proxy hacia el backend
# =============================================================================
# Que el proxy viva acá es lo que permite que el build de producción use rutas
# relativas (/api, /auth, ver environment.ts): frontend y API quedan en el mismo
# origen, así que no hace falta CORS ni exponer el 8080 al navegador.
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El backend acepta subidas de hasta 20 MB (spring.servlet.multipart).
    # El default de nginx es 1 MB: sin esto, los PDF grandes fallaban con 413
    # antes de llegar siquiera a la aplicación.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- API ----------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Compilar el expediente y generar PDFs puede tardar bastante más que el
        # default de 60s, sobre todo con muchos documentos.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- Autenticación ------------------------------------------------------
    location /auth/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Documentación de la API (springdoc) --------------------------------
    location ~ ^/(swagger-ui|api-docs) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # --- Assets del visor de PDF -------------------------------------------
    # `^~` para que este prefijo gane sobre las locations regex de más abajo:
    # si no, un .js de esta carpeta caería en la regla de cacheo agresivo.
    #
    # Estos archivos los publica la librería y su nombre lleva la VERSIÓN
    # (viewer-6.0.1165.mjs), no un hash del contenido. Por eso NO pueden ser
    # `immutable`: si cambia el archivo —o sus headers— el navegador tiene que
    # enterarse. Revalidan siempre contra el ETag, que es barato (un 304 vacío).
    #
    # Aprendido a la mala: se sirvieron un tiempo como application/octet-stream
    # (ver el bloque .mjs) y, marcados como immutable, los navegadores que
    # alcanzaron a cachearlos se quedaban con el MIME equivocado. Un 304 no
    # reenvía Content-Type, así que ni revalidando se corregía y el visor no
    # arrancaba para nadie que ya hubiera abierto la app.
    location ^~ /assets/ {
        add_header Cache-Control "public, no-cache";
        try_files $uri =404;

        # nginx no trae .mjs en mime.types y los serviría como
        # application/octet-stream. El navegador aplica chequeo estricto de MIME
        # a los ES modules y BLOQUEA los que no vengan como JavaScript, con lo
        # que el visor no llega a inicializarse y no se ve ningún PDF, ni los
        # generados por el sistema ni los subidos. Se fuerza el tipo con
        # default_type y no con un bloque `types`, que reemplazaría el mapa
        # heredado en lugar de extenderlo.
        location ~* \.mjs$ {
            default_type text/javascript;
            add_header Cache-Control "public, no-cache";
            try_files $uri =404;
        }
    }

    # --- Salida del build de Angular ---------------------------------------
    # Acá sí: el nombre lleva hash de contenido (main-AXY5ZL34.js), así que el
    # archivo nunca cambia sin cambiar de URL y se puede cachear para siempre.
    location ~* \.(js|css|woff2?|ttf|otf|png|jpg|jpeg|gif|svg|ico|wasm)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Cualquier otra ruta la resuelve el router de Angular. Sin este fallback,
    # entrar directo a /expedientes o recargar la página daba 404.
    #
    # El shell (index.html) va con no-cache a propósito: es el único archivo con
    # nombre fijo y es el que apunta a los bundles con hash. Sin esta cabecera el
    # navegador le aplica caché heurística, se queda con una copia vieja y sigue
    # pidiendo los bundles viejos: un deploy no llega nunca. Es barato, porque
    # revalidar contra el ETag devuelve un 304 vacío.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
