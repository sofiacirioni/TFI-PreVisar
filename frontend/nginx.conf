# =============================================================================
# Nginx — sirve la SPA compilada y hace de proxy hacia el backend
# =============================================================================
# Que el proxy viva acá es lo que permite que el build de producción use rutas
# relativas (/api, /auth, ver environment.ts): frontend y API quedan en el mismo
# origen, así que no hace falta CORS ni exponer el 8080 al navegador.
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El backend acepta subidas de hasta 20 MB (spring.servlet.multipart).
    # El default de nginx es 1 MB: sin esto, los PDF grandes fallaban con 413
    # antes de llegar siquiera a la aplicación.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- API ----------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Compilar el expediente y generar PDFs puede tardar bastante más que el
        # default de 60s, sobre todo con muchos documentos.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- Autenticación ------------------------------------------------------
    location /auth/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Documentación de la API (springdoc) --------------------------------
    location ~ ^/(swagger-ui|api-docs) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # --- SPA ----------------------------------------------------------------
    # Módulos ES del visor de PDF (viewer-*.mjs, pdf.worker-*.mjs).
    #
    # nginx no trae la extensión .mjs en mime.types, así que los servía como
    # application/octet-stream. El navegador aplica chequeo estricto de MIME a los
    # ES modules y BLOQUEA los que no vengan como JavaScript, de modo que el visor
    # no llegaba a inicializarse y ningún PDF se veía —ni los generados por el
    # sistema ni los subidos—. Se fuerza el tipo con default_type (y no con un
    # bloque `types`, que reemplazaría el mapa heredado en vez de extenderlo).
    location ~* \.mjs$ {
        default_type text/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # El resto de los assets: llevan hash o versión en el nombre, así que se
    # cachean fuerte.
    location ~* \.(js|css|woff2?|ttf|otf|png|jpg|jpeg|gif|svg|ico|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Cualquier otra ruta la resuelve el router de Angular. Sin este fallback,
    # entrar directo a /expedientes o recargar la página daba 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
