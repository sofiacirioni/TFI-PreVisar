<div class="auth-shell">
  <div class="auth-brand">
    <img class="auth-logo" src="logo/previsar-wordmark.svg" alt="PreVisar" />
    <p>Asistente de armado de expedientes técnicos</p>
  </div>

  <div class="auth-split" [class.auth-split--con-ilustracion]="esLogin()">
    @if (esLogin()) {
      <!-- Decorativa: no aporta información que el texto no dé, por eso alt="". -->
      <div class="auth-ilustracion">
        <img src="illustrations/login.svg" alt="" />
      </div>
    }

    <div class="auth-content">
      <router-outlet />
    </div>
  </div>

  <footer class="auth-footer">
    <span>TFI Tecnicatura en Programación · UTN FRC · 2026</span>
  </footer>
</div>
