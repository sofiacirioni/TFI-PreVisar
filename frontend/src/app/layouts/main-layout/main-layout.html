<mat-sidenav-container class="layout-container" autosize>

  <!-- ===== Sidebar ===== -->
  <mat-sidenav
    [mode]="esMovil() ? 'over' : 'side'"
    [opened]="esMovil() ? cajonAbierto() : true"
    (closedStart)="cajonAbierto.set(false)"
    [class.colapsado]="!esMovil() && !mostrarEtiquetas()"
    class="sidebar"
  >
    <div class="sidebar-brand">
      @if (mostrarEtiquetas()) {
        <img class="brand-wordmark" src="logo/previsar-wordmark.svg" alt="PreVisar" />
      } @else {
        <img class="brand-mark" src="logo/previsar-mark.svg" alt="PreVisar" />
      }
    </div>

    <mat-divider />

    <nav class="sidebar-nav">
      @for (item of navItems(); track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="activo"
          [matTooltip]="mostrarEtiquetas() ? '' : item.label"
          matTooltipPosition="right"
          class="nav-item"
        >
          <mat-icon [svgIcon]="item.icon"></mat-icon>
          @if (mostrarEtiquetas()) {
            <span class="nav-item__label">{{ item.label }}</span>
          }
        </a>
      }
    </nav>
  </mat-sidenav>

  <!-- ===== Contenido principal ===== -->
  <mat-sidenav-content class="content-area">

    <mat-toolbar class="topbar">
      <button
        mat-icon-button
        (click)="toggleSidebar()"
        [matTooltip]="
          esMovil()
            ? cajonAbierto()
              ? 'Cerrar menú'
              : 'Abrir menú'
            : sidebarExpandido()
              ? 'Colapsar menú'
              : 'Expandir menú'
        "
        [attr.aria-label]="esMovil() && !cajonAbierto() ? 'Abrir menú' : 'Cerrar menú'"
      >
        <mat-icon svgIcon="menu"></mat-icon>
      </button>

      <span class="spacer"></span>

      @if (sesion(); as s) {
        <button mat-button [matMenuTriggerFor]="userMenu" class="user-menu-trigger">
          <mat-icon svgIcon="account_circle"></mat-icon>
          <span class="user-email">{{ s.email }}</span>
          <mat-icon svgIcon="arrow_drop_down"></mat-icon>
        </button>

        <mat-menu #userMenu="matMenu">
          <button mat-menu-item routerLink="/profile">
            <mat-icon svgIcon="person"></mat-icon>
            <span>Mi perfil</span>
          </button>
          <button mat-menu-item routerLink="/ayuda">
            <mat-icon svgIcon="help_outline"></mat-icon>
            <span>Preguntas frecuentes</span>
          </button>
          <mat-divider />
          <button mat-menu-item (click)="logout()">
            <mat-icon svgIcon="logout"></mat-icon>
            <span>Cerrar sesión</span>
          </button>
        </mat-menu>
      }
    </mat-toolbar>

    <main class="page-content" [class.page-content--full]="anchoCompleto()">
      <router-outlet />
    </main>

  </mat-sidenav-content>
</mat-sidenav-container>
