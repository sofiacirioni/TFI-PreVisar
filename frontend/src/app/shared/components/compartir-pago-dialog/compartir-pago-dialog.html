<h2 mat-dialog-title>Compartir link de pago</h2>

<mat-dialog-content>
  <p class="compartir__ayuda">
    Enviá este link al comitente para que pague el arancel desde Mercado Pago. No necesita acceso
    a la aplicación.
  </p>

  <mat-form-field appearance="outline" class="compartir__campo">
    <mat-label>Link de pago</mat-label>
    <input matInput readonly [value]="data.initPoint" (focus)="$any($event.target).select()" />
    <button
      matSuffix
      mat-icon-button
      type="button"
      (click)="copiar()"
      aria-label="Copiar link de pago"
    >
      <mat-icon>{{ copiado() ? 'check' : 'content_copy' }}</mat-icon>
    </button>
  </mat-form-field>

  @if (copiado()) {
    <p class="compartir__copiado">¡Link copiado!</p>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cerrar</button>
  <a mat-flat-button color="primary" [href]="whatsappUrl" target="_blank" rel="noopener">
    <mat-icon>share</mat-icon>
    Compartir por WhatsApp
  </a>
</mat-dialog-actions>
