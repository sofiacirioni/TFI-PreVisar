services:
  postgres:
    image: postgres:16-alpine
    container_name: previsar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: previsar
      POSTGRES_USER: previsar
      POSTGRES_PASSWORD: previsar_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U previsar -d previsar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: