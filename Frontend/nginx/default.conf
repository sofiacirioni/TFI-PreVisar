server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Manejo de rutas de Angular (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

     # Archivos estáticos
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }
}